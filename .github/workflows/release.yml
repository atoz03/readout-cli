name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate tag and source commit
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          crate_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$RELEASE_TAG" != "v$crate_version" ]; then
            echo "release tag $RELEASE_TAG does not match crate version v$crate_version" >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "release tag $RELEASE_TAG does not point to a commit on main" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so one Linux binary runs on every distro regardless of its
          # glibc. The dependency tree is pure Rust, so it links statically
          # with nothing to reconcile.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Package
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          TARGET: ${{ matrix.target }}
          RUNNER_OS_LABEL: ${{ runner.os }}
        run: |
          set -euo pipefail
          name="readout-${RELEASE_TAG}-${TARGET}"
          mkdir -p "dist/${name}"
          if [ "$RUNNER_OS_LABEL" = "Windows" ]; then
            cp "target/${TARGET}/release/readout.exe" "dist/${name}/"
          else
            cp "target/${TARGET}/release/readout" "dist/${name}/"
          fi
          cp README.md LICENSE "dist/${name}/"
          cd dist
          if [ "$RUNNER_OS_LABEL" = "Windows" ]; then
            archive="${name}.zip"
            7z a -bso0 "${archive}" "${name}" >/dev/null
          else
            archive="${name}.tar.gz"
            tar czf "${archive}" "${name}"
          fi
          # Checksums are produced next to the artifact on the machine that
          # built it, so nothing between here and the release page can alter
          # a binary without the sum disagreeing.
          if command -v sha256sum >/dev/null; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
          echo "archive=dist/${archive}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  release:
    name: Publish release and crate
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/readout-artifacts
          merge-multiple: true

      - name: Collect checksums
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/readout-artifacts
        run: |
          set -euo pipefail
          cd "$ARTIFACT_DIR"
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          cp "$GITHUB_WORKSPACE/install.sh" "$GITHUB_WORKSPACE/install.ps1" .
          sha256sum install.sh install.ps1 >> SHA256SUMS
          ls -l

      - name: Verify tag matches crate version
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          crate_version="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "readout") | .version')"
          if [ "$RELEASE_TAG" != "$crate_version" ]; then
            echo "release tag $RELEASE_TAG does not match crate version $crate_version" >&2
            exit 1
          fi

      - name: Authenticate to crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Create the release
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/readout-artifacts
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARTIFACT_DIR"/* --clobber
          else
            gh release create "$RELEASE_TAG" "$ARTIFACT_DIR"/* \
              --title "readout $RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: |
          # 前面的无密钥 job 已完成构建和测试；这里不再让构建脚本继承发布凭据。
          cargo publish --locked --no-verify
