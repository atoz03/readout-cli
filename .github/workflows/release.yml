name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so one Linux binary runs on every distro regardless of its
          # glibc. The dependency tree is pure Rust, so it links statically
          # with nothing to reconcile.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"
          name="readout-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/readout.exe" "dist/${name}/"
          else
            cp "target/${{ matrix.target }}/release/readout" "dist/${name}/"
          fi
          cp README.md LICENSE "dist/${name}/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            archive="${name}.zip"
            7z a -bso0 "${archive}" "${name}" >/dev/null
          else
            archive="${name}.tar.gz"
            tar czf "${archive}" "${name}"
          fi
          # Checksums are produced next to the artifact on the machine that
          # built it, so nothing between here and the release page can alter
          # a binary without the sum disagreeing.
          if command -v sha256sum >/dev/null; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
          echo "archive=dist/${archive}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          set -euo pipefail
          cd artifacts
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -l

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" artifacts/* \
            --title "readout $tag" \
            --generate-notes \
            --verify-tag

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches crate version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          crate_version="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "readout") | .version')"
          if [ "$RELEASE_TAG" != "$crate_version" ]; then
            echo "release tag $RELEASE_TAG does not match crate version $crate_version" >&2
            exit 1
          fi
      - name: cargo publish
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Skip rather than fail when the secret is absent: a release with
          # binaries attached is still a good release, and a repo fork has no
          # business publishing to the registry at all.
          if [ -z "${TOKEN}" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not set — skipping crates.io publish"
            exit 0
          fi
          cargo publish --locked --token "${TOKEN}"
