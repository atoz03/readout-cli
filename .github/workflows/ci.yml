name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned, not `stable`: every Rust release adds lints, and a floating
      # toolchain turns `-D warnings` into a build that breaks on an untouched
      # repository. Bump this deliberately and fix the new lints in that commit.
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # 这是唯一会运行二进制的 job。五个重定向缺一不可：每个子命令都会加载
      # settings，漏掉 READOUT_CONFIG_DIR 就会写 runner 的真实 home。runner 上下文
      # 不能用于 job 级 env，因此在 step 中通过 GITHUB_ENV 传给后续所有步骤。
      # transcript 目录有意不创建，用同一份空状态覆盖三个平台的 smoke test。
      - name: Isolate readout paths
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "readout-ci"
          "READOUT_CLAUDE_DIR=$(Join-Path $root 'claude')" >> $env:GITHUB_ENV
          "READOUT_CODEX_DIR=$(Join-Path $root 'codex')" >> $env:GITHUB_ENV
          "READOUT_STATE_DIR=$(Join-Path $root 'state')" >> $env:GITHUB_ENV
          "READOUT_CONFIG_DIR=$(Join-Path $root 'config')" >> $env:GITHUB_ENV
          "READOUT_SSH_CONFIG=$(Join-Path $root 'ssh_config')" >> $env:GITHUB_ENV
      - run: cargo test --all-targets
      # One optimized run, on one platform: the frame-budget test only asserts
      # when optimized, and a debug timing measured against a runtime budget
      # would be measuring the profile rather than the code.
      - name: Test optimized
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release
      # The dashboard is the part tests reach least, so render one frame on
      # every platform. With no transcripts present this exercises the empty
      # state, which is exactly the path a fresh install hits first.
      - name: Smoke-test the renderer
        run: cargo run --quiet -- snapshot --width 100 --height 30
      - name: Smoke-test the text output
        run: cargo run --quiet -- summary --json
