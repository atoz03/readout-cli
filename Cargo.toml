[package]
name = "readout"
version = "0.2.3"
edition = "2024"
description = "Read-only usage statistics for Claude Code and Codex, with a clickable TUI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/atoz03/readout-cli"
homepage = "https://github.com/atoz03/readout-cli"
keywords = ["cli", "tui", "claude", "codex", "usage"]
categories = ["command-line-utilities", "visualization"]
# Only what a build needs. The screenshots and the packaged binaries are not
# part of the crate.
exclude = [".github/", ".netcatty-paste-images/", "install.sh", "install.ps1", "CLAUDE.md"]

[[bin]]
name = "readout"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
memchr = "2.8.3"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
